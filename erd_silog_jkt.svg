<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 950" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { fill: #f8fafc; font-size: 22px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .tbl-header { fill: #1e293b; }
      .tbl-header-txt { fill: #38bdf8; font-size: 13px; font-weight: bold; }
      .tbl-body { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .col-txt { fill: #e2e8f0; font-size: 11px; }
      .type-txt { fill: #64748b; font-size: 10px; font-family: monospace; }
      .pk-badge { fill: #fbbf24; font-size: 9px; font-weight: bold; }
      .fk-badge { fill: #38bdf8; font-size: 9px; font-weight: bold; }
      .rel-line { fill: none; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .rel-line-solid { fill: none; stroke: #0284c7; stroke-width: 1.8; }
      .marker-circle { fill: #0284c7; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- TITLE BLOCK -->
  <text x="50" y="45" class="title">DIAGRAM RELASI ENTITAS (ERD) - SILOG-JKT</text>
  <text x="50" y="68" class="subtitle">Sistem Informasi Bantuan dan Distribusi Logistik DKI Jakarta | 10 Tabel Relasional</text>

  <!-- LINES / CONNECTORS -->
  <!-- bencana to posko -->
  <path d="M 230, 260 L 230, 320" class="rel-line-solid" />
  <!-- bencana to distribusi -->
  <path d="M 330, 180 L 510, 180" class="rel-line-solid" />
  <!-- posko to distribusi -->
  <path d="M 330, 400 L 420, 400 L 420, 240 L 510, 240" class="rel-line-solid" />
  <!-- posko to pengguna -->
  <path d="M 230, 560 L 230, 640" class="rel-line-solid" />
  <!-- posko to kebutuhan_logistik -->
  <path d="M 120, 420 L 60, 420 L 60, 680 L 510, 680" class="rel-line" />
  <!-- posko to stok_posko -->
  <path d="M 120, 450 L 40, 450 L 40, 830 L 510, 830" class="rel-line" />

  <!-- jenis_logistik to stok_gudang -->
  <path d="M 1030, 340 L 1100, 340" class="rel-line-solid" />
  <!-- jenis_logistik to distribusi -->
  <path d="M 830, 320 L 740, 320" class="rel-line-solid" />
  <!-- jenis_logistik to bantuan_masuk -->
  <path d="M 930, 440 L 930, 520" class="rel-line-solid" />
  <!-- jenis_logistik to kebutuhan_logistik -->
  <path d="M 880, 440 L 880, 710 L 730, 710" class="rel-line" />
  <!-- jenis_logistik to stok_posko -->
  <path d="M 910, 440 L 910, 860 L 730, 860" class="rel-line" />

  <!-- pengguna to distribusi -->
  <path d="M 330, 700 L 440, 700 L 440, 300 L 510, 300" class="rel-line" />
  <!-- pengguna to bantuan_masuk -->
  <path d="M 330, 740 L 460, 740 L 460, 580 L 830, 580" class="rel-line" />
  <!-- pengguna to log_audit -->
  <path d="M 230, 830 L 230, 870 L 830, 870 L 830, 760" class="rel-line" />


  <!-- TABLE 1: BENCANA (Col 1, Row 1) -->
  <g transform="translate(120, 100)" filter="url(#shadow)">
    <rect width="210" height="160" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 210 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">bencana</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_bencana</text><text x="145" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="70" class="col-txt">jenis</text><text x="145" y="70" class="type-txt">VARCHAR(40)</text>
    <text x="35" y="90" class="col-txt">tanggal_kejadian</text><text x="145" y="90" class="type-txt">DATE</text>
    <text x="35" y="110" class="col-txt">wilayah</text><text x="145" y="110" class="type-txt">VARCHAR(40)</text>
    <text x="35" y="130" class="col-txt">status</text><text x="145" y="130" class="type-txt">ENUM</text>
    <text x="35" y="150" class="col-txt">keterangan</text><text x="145" y="150" class="type-txt">VARCHAR(255)</text>
  </g>

  <!-- TABLE 2: POSKO (Col 1, Row 2) -->
  <g transform="translate(120, 320)" filter="url(#shadow)">
    <rect width="210" height="180" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 210 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">posko</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_posko</text><text x="145" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="70" class="col-txt">nama</text><text x="145" y="70" class="type-txt">VARCHAR(60)</text>
    <text x="35" y="90" class="col-txt">alamat</text><text x="145" y="90" class="type-txt">VARCHAR(150)</text>
    <text x="35" y="110" class="col-txt">wilayah</text><text x="145" y="110" class="type-txt">VARCHAR(40)</text>
    <text x="35" y="130" class="col-txt">kontak</text><text x="145" y="130" class="type-txt">VARCHAR(15)</text>
    <text x="35" y="150" class="col-txt">status</text><text x="145" y="150" class="type-txt">ENUM</text>
    <text x="12" y="170" class="fk-badge">FK</text>
    <text x="35" y="170" class="col-txt">id_bencana</text><text x="145" y="170" class="type-txt">VARCHAR(10)</text>
  </g>

  <!-- TABLE 3: PENGGUNA (Col 1, Row 3) -->
  <g transform="translate(120, 640)" filter="url(#shadow)">
    <rect width="210" height="150" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 210 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">pengguna</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_pengguna</text><text x="145" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="70" class="col-txt">nama_pengguna</text><text x="145" y="70" class="type-txt">VARCHAR(30)</text>
    <text x="35" y="90" class="col-txt">kata_sandi</text><text x="145" y="90" class="type-txt">VARCHAR(255)</text>
    <text x="35" y="110" class="col-txt">peran</text><text x="145" y="110" class="type-txt">ENUM</text>
    <text x="12" y="130" class="fk-badge">FK</text>
    <text x="35" y="130" class="col-txt">id_posko</text><text x="145" y="130" class="type-txt">VARCHAR(10)</text>
  </g>

  <!-- TABLE 4: DISTRIBUSI (Center Top) -->
  <g transform="translate(510, 100)" filter="url(#shadow)">
    <rect width="230" height="280" rx="8" class="tbl-body" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0,0 H 230 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">distribusi (Tabel Transaksi)</text>
    <line x1="0" y1="30" x2="230" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_distribusi</text><text x="160" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="70" class="fk-badge">FK</text>
    <text x="35" y="70" class="col-txt">id_bencana</text><text x="160" y="70" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="90" class="fk-badge">FK</text>
    <text x="35" y="90" class="col-txt">id_posko</text><text x="160" y="90" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="110" class="fk-badge">FK</text>
    <text x="35" y="110" class="col-txt">id_jenis</text><text x="160" y="110" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="130" class="fk-badge">FK</text>
    <text x="35" y="130" class="col-txt">id_pengguna</text><text x="160" y="130" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="150" class="col-txt">jumlah</text><text x="160" y="150" class="type-txt">INT UNSIGNED</text>
    <text x="35" y="170" class="col-txt">tanggal_kirim</text><text x="160" y="170" class="type-txt">DATE</text>
    <text x="35" y="190" class="col-txt">status</text><text x="160" y="190" class="type-txt">ENUM</text>
    <text x="35" y="210" class="col-txt">jumlah_diterima</text><text x="160" y="210" class="type-txt">INT UNSIGNED</text>
    <text x="35" y="230" class="col-txt">tanggal_terima</text><text x="160" y="230" class="type-txt">DATE</text>
    <text x="35" y="250" class="col-txt">catatan</text><text x="160" y="250" class="type-txt">VARCHAR(255)</text>
  </g>

  <!-- TABLE 5: KEBUTUHAN_LOGISTIK (Center Middle) -->
  <g transform="translate(510, 630)" filter="url(#shadow)">
    <rect width="220" height="135" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 220 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">kebutuhan_logistik</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_kebutuhan</text><text x="155" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="70" class="fk-badge">FK</text>
    <text x="35" y="70" class="col-txt">id_posko</text><text x="155" y="70" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="90" class="fk-badge">FK</text>
    <text x="35" y="90" class="col-txt">id_jenis</text><text x="155" y="90" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="110" class="col-txt">jumlah_dibutuhkan</text><text x="155" y="110" class="type-txt">INT UNSIGNED</text>
    <text x="35" y="130" class="col-txt">tanggal</text><text x="155" y="130" class="type-txt">DATE</text>
  </g>

  <!-- TABLE 6: STOK_POSKO (Center Bottom) -->
  <g transform="translate(510, 790)" filter="url(#shadow)">
    <rect width="220" height="135" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 220 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">stok_posko</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_stok</text><text x="155" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="70" class="fk-badge">FK</text>
    <text x="35" y="70" class="col-txt">id_posko</text><text x="155" y="70" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="90" class="fk-badge">FK</text>
    <text x="35" y="90" class="col-txt">id_jenis</text><text x="155" y="90" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="110" class="col-txt">jumlah</text><text x="155" y="110" class="type-txt">INT UNSIGNED</text>
    <text x="35" y="130" class="col-txt">tanggal_pembaruan</text><text x="155" y="130" class="type-txt">DATETIME</text>
  </g>

  <!-- TABLE 7: JENIS_LOGISTIK (Right Middle) -->
  <g transform="translate(830, 290)" filter="url(#shadow)">
    <rect width="200" height="115" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 200 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">jenis_logistik</text>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_jenis</text><text x="140" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="70" class="col-txt">nama</text><text x="140" y="70" class="type-txt">VARCHAR(50)</text>
    <text x="35" y="90" class="col-txt">satuan</text><text x="140" y="90" class="type-txt">VARCHAR(15)</text>
  </g>

  <!-- TABLE 8: STOK_GUDANG (Right Top) -->
  <g transform="translate(1100, 290)" filter="url(#shadow)">
    <rect width="200" height="115" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 200 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">stok_gudang</text>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_stok</text><text x="140" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="70" class="fk-badge">FK</text>
    <text x="35" y="70" class="col-txt">id_jenis</text><text x="140" y="70" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="90" class="col-txt">jumlah</text><text x="140" y="90" class="type-txt">INT UNSIGNED</text>
  </g>

  <!-- TABLE 9: BANTUAN_MASUK (Right Bottom 1) -->
  <g transform="translate(830, 470)" filter="url(#shadow)">
    <rect width="220" height="150" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 220 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">bantuan_masuk</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_bantuan</text><text x="155" y="50" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="70" class="col-txt">sumber</text><text x="155" y="70" class="type-txt">VARCHAR(60)</text>
    <text x="35" y="90" class="col-txt">tanggal_masuk</text><text x="155" y="90" class="type-txt">DATE</text>
    <text x="35" y="110" class="col-txt">jumlah</text><text x="155" y="110" class="type-txt">INT UNSIGNED</text>
    <text x="12" y="130" class="fk-badge">FK</text>
    <text x="35" y="130" class="col-txt">id_jenis</text><text x="155" y="130" class="type-txt">VARCHAR(10)</text>
    <text x="12" y="150" class="fk-badge">FK</text>
    <text x="35" y="150" class="col-txt">id_pengguna</text><text x="155" y="150" class="type-txt">VARCHAR(10)</text>
  </g>

  <!-- TABLE 10: LOG_AUDIT (Right Bottom 2) -->
  <g transform="translate(830, 660)" filter="url(#shadow)">
    <rect width="220" height="150" rx="8" class="tbl-body"/>
    <path d="M 0,0 H 220 V 30 H 0 Z" class="tbl-header" clip-path="inset(0 0 0 0 round 8px 8px 0 0)"/>
    <text x="12" y="20" class="tbl-header-txt">log_audit</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="50" class="pk-badge">PK</text>
    <text x="35" y="50" class="col-txt font-bold">id_log</text><text x="155" y="50" class="type-txt">INT UNSIGNED</text>
    <text x="12" y="70" class="fk-badge">FK</text>
    <text x="35" y="70" class="col-txt">id_pengguna</text><text x="155" y="70" class="type-txt">VARCHAR(10)</text>
    <text x="35" y="90" class="col-txt">waktu</text><text x="155" y="90" class="type-txt">DATETIME</text>
    <text x="35" y="110" class="col-txt">data_terkait</text><text x="155" y="110" class="type-txt">VARCHAR(100)</text>
    <text x="35" y="130" class="col-txt">nilai_sebelum</text><text x="155" y="130" class="type-txt">VARCHAR(255)</text>
    <text x="35" y="150" class="col-txt">nilai_sesudah</text><text x="155" y="150" class="type-txt">VARCHAR(255)</text>
  </g>

</svg>
